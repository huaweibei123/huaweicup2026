[project]
name = "paper-vector-trace"
version = "0.1.0"
description = "Locked, local raster-to-vector tracing and automatic fidelity checks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vtracer==1.0.0a4",
  "cairosvg>=2.8,<3",
  "pillow>=11,<13",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
]

[tool.uv]
package = false
link-mode = "copy"
