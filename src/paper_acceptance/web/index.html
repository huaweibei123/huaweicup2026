<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light"><title>论文验收台 · 华为杯</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<a class="skip" href="#workspace">跳到验收内容</a>
<aside class="sidebar">
 <a class="brand" href="/" aria-label="论文验收台首页"><span class="brand-symbol">A<span>✓</span></span><span>论文验收台<small>HUAWEI CUP / 2026</small></span></a>
 <div class="sidebar-label">审阅工作区</div>
 <nav aria-label="主导航">
  <button data-view="matrix" class="nav active"><span>01</span>逐项验收</button>
  <button data-view="language" class="nav"><span>02</span>语言逐处检查</button>
  <button data-view="compare" class="nav"><span>03</span>原文对照</button>
  <button data-view="figures" class="nav"><span>04</span>图件审阅</button>
  <button data-view="team" class="nav"><span>05</span>团队与监督</button>
  <button data-view="requirements" class="nav"><span>06</span>题面硬性要求</button>
  <button data-view="agent" class="nav"><span>07</span>Agent 接口</button>
 </nav>
 <div class="sidebar-bottom"><div class="version-mark">对照基线 · CP01</div><p>标准更严格<br>结论有依据</p><button id="theme" class="theme">切换浅色</button><a href="https://github.com/huaweibei123/huaweicup2026/issues/217" target="_blank" rel="noreferrer">共享审阅 · Issue 217 ↗</a></div>
</aside>
<div class="shell">
 <header class="topbar"><div><span class="crumb">论文 / </span><span id="view-title">逐项验收</span></div><div class="top-actions"><span id="identity-label">本地审阅</span><button id="identity">连接本人 GitHub</button><button id="sync" class="button-accent">同步审阅</button></div></header>
 <main id="workspace" tabindex="-1">
  <section class="heading"><div><div class="eyebrow">REVIEW DESK <span id="standard-version"></span></div><h1 id="main-title">逐项对照，凭证据通过。</h1><p id="subtitle">从论文中的具体差距出发，逐条检查更严格的标准。</p></div><div class="release"><span class="status needs_work" id="release-state">未通过验收</span><small id="paper-version">正在读取固定论文…</small></div></section>
  <div id="notice" class="notice" role="status" aria-live="polite">正在加载验收资料…</div>
  <section id="checkpoint-status" class="checkpoint-status" aria-label="论文检查点与发布状态" hidden></section>
  <section id="stats" class="stats" aria-label="验收状态"></section>
  <section id="filters" class="filters"><label class="search"><span>检索</span><input id="search" type="search" placeholder="条目、黑话、章节或证据…" aria-label="搜索验收项"></label><label><span>范围</span><select id="group"><option value="">全部维度</option></select></label><label><span>状态</span><select id="status"><option value="">全部状态</option><option value="needs_work">待整改</option><option value="unreviewed">待核验</option><option value="ready">已提交</option><option value="verified">已复核</option><option value="accepted">已接受</option></select></label><label class="check-inline"><input type="checkbox" id="blockers">只看阻断项</label><span id="result-count" class="muted"></span></section>
  <div id="content"></div>
  <footer><span>论文版本、标准版本与证据共同决定验收状态。勾选完成不等于通过。</span><a href="/api/v1/export" target="_blank">导出当前快照 ↗</a></footer>
 </main>
</div>
<dialog id="review-dialog"><form id="review-form"><div class="dialog-head"><div><small>REVIEW RECORD</small><h2 id="review-title">记录审阅</h2></div><button type="button" id="close-review" aria-label="关闭审阅表单">×</button></div><p class="muted">保存到本机后，可在“团队与监督”中显式发布到共享 Issue。</p><label>会话身份<input id="review-session" required placeholder="login/s-你的会话标识"></label><label>审阅结果<select id="review-decision"><option value="comment">补充意见（不改验收状态）</option><option value="needs_work">要求整改</option><option value="ready">作者提交复核</option><option value="verified">独立复核通过</option><option value="accepted">队长最终接受</option><option value="reopen">重新打开问题</option></select></label><fieldset><legend>本条验收要求</legend><div id="review-checks"></div></fieldset><label>证据链接<textarea id="review-evidence" rows="2" placeholder="每行一条 HTTPS 原件链接；通过类操作须含组织主库40位提交链接"></textarea></label><label>依据与剩余问题<textarea id="review-note" rows="4" required minlength="5" placeholder="写清实际检查了什么、发现了什么，以及未验证范围。"></textarea></label><div id="review-error" role="alert"></div><div class="dialog-actions"><button type="button" id="cancel-review">取消</button><button class="button-accent" type="submit">保存本地审阅</button></div></form></dialog>
</body></html>
